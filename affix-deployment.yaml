apiVersion: apps/v1
kind: Deployment
metadata:
  name: affix-deployment
  namespace: apps
  labels:
    app: affix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: affix
  template:
    metadata:
      labels:
        app: affix
    spec:
      containers:
      - name: affix
        image: ghcr.io/georgievlb/affix:main
        ports:
        - containerPort: 5000
