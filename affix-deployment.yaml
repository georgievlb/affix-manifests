apiVersion: apps/v1
kind: Deployment
metadata:
  name: affix-deployment
  namespace: affix
  labels:
    app: affix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: affix
  template:
    metadata:
      labels:
        app: affix
    spec:
      containers:
      - name: affix
        image: ghcr.io/georgievlb/affix:latest
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef: 
              name: affix-db
              key: conn_string
        ports:
        - containerPort: 5000
